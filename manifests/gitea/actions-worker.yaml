apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: actions-act-runner
  name: actions-act-runner
  namespace: gitea
spec:
  selector:
    matchLabels:
      app: actions-act-runner
  strategy: {}
  template:
    metadata:
      labels:
        app: actions-act-runner
    spec:
      containers:
      - env:
        - name: CONFIG_FILE
          value: /etc/act_runner/config.yaml
        - name: GITEA_INSTANCE_URL
          value: https://danicos.dev
        - name: GITEA_RUNNER_LABELS
          value: actions-act-runner:host
        - name: GITEA_RUNNER_NAME
          value: actions-act-runner
        - name: GITEA_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              key: act-runner-actions-token
              name: gitea-secret
        image: docker.io/gitea/runner:latest
        name: actions-act-runner
        resources: {}
        volumeMounts:
        - mountPath: /etc/act_runner
          name: config
          readOnly: true
        - mountPath: /data
          name: data
        - mountPath: /root/.cache
          name: cache
        - mountPath: /var/run
          name: docker-socket
      initContainers:
      - image: docker:28.2.2-dind
        livenessProbe:
          exec:
            command:
            - /usr/bin/test
            - -S
            - /var/run/docker.sock
        name: docker
        resources: {}
        restartPolicy: Always
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command:
            - /usr/bin/test
            - -S
            - /var/run/docker.sock
        volumeMounts:
        - mountPath: /var/run
          name: docker-socket
      restartPolicy: Always
      volumes:
      - configMap:
          name: gitea-configmap
        name: config
      - name: data
        persistentVolumeClaim:
          claimName: actions-act-runner-pvc
      - name: cache
        persistentVolumeClaim:
          claimName: actions-cache-act-runner-pvc
      - emptyDir: {}
        name: docker-socket
status: {}
