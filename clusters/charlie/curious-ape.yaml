---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: curious-ape
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://danicos.dev/daniel/curious-ape.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: curious-ape
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./deployment/kubernetes/overlays/flux
  prune: true
  sourceRef:
    kind: GitRepository
    name: curious-ape
  decryption:
    provider: sops
    secretRef:
      name: sops-age
