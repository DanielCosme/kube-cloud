apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sysctl-inotify
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: sysctl-inotify
  template:
    metadata:
      labels:
        name: sysctl-inotify
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: sysctl
          image: busybox
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              sysctl -w fs.inotify.max_user_watches=524288
              sysctl -w fs.inotify.max_user_instances=8192
              sysctl -w fs.inotify.max_queued_events=32768
              sleep infinity
